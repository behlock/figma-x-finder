<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 12px/1.5 Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h1 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--figma-color-text-secondary, #666); }
  label { display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 8px; margin-bottom: 10px; color: inherit; background: var(--figma-color-bg-secondary, #f5f5f5); border: 1px solid var(--figma-color-border, #ddd); border-radius: 4px; }
  button { padding: 8px 12px; border: 1px solid var(--figma-color-border, #ddd); border-radius: 4px; background: var(--figma-color-bg-secondary, #f5f5f5); color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #save { width: 100%; background: var(--figma-color-bg-brand, #0d63e5); color: var(--figma-color-text-onbrand, #fff); border: 0; }
  #status { margin: 14px 0 0; overflow-wrap: anywhere; }
  details { margin: 12px 0; }
  summary { margin-bottom: 8px; cursor: pointer; }
</style>
<h1>Receive from Finder</h1>
<p>Select a frame, or deselect everything to use this page. Keep this receiver open while collecting.</p>
<label for="name">Destination name</label>
<input id="name" maxlength="120" placeholder="Inspiration">
<button id="save" disabled>Save destination</button>
<details id="connection">
  <summary>Connection</summary>
  <label for="key">Connection key from the macOS app</label>
  <input id="key" type="password" autocomplete="off" spellcheck="false">
  <button id="connect">Connect</button>
</details>
<p id="status" role="status" aria-live="polite">Connecting…</p>
<script>
  const endpoint = 'http://localhost:17847';
  const receiver = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const pending = new Map();
  let sequence = 0, token = '', fileKey = null, busy = false, registered = false;
  const status = document.getElementById('status');
  const save = document.getElementById('save');

  function rpc(type, payload = {}) {
    const requestID = ++sequence;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(requestID); reject(new Error('Figma did not respond. Close and rerun this receiver to retry.')); }, 30000);
      pending.set(requestID, { resolve, reject, timeout });
      parent.postMessage({ pluginMessage: { type, requestID, ...payload } }, '*');
    });
  }

  async function api(path, body) {
    const response = await fetch(endpoint + path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { Authorization: `Bearer ${token}`, ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: AbortSignal.timeout(10000)
    });
    if (!response.ok) {
      if (response.status === 401) throw new Error('Connection key doesn’t match. Copy it from the macOS app again.');
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || 'The local connection interrupted delivery. Retrying…');
    }
    return response;
  }

  async function poll() {
    if (!token || !fileKey || busy) return;
    busy = true;
    let job;
    try {
      const response = await api(`/v1/jobs?fileKey=${encodeURIComponent(fileKey)}&receiver=${encodeURIComponent(receiver)}`);
      if (response.status === 204) {
        save.disabled = false;
        if (!registered) status.textContent = 'Connected. Save a destination, then send images from Finder.';
        return;
      }
      job = await response.json();
      save.disabled = true;
      const prepared = await rpc('prepare', { job });
      const completed = new Set(job.completed);
      for (const image of job.images) {
        if (completed.has(image.id)) continue;
        status.textContent = `Adding ${image.name}…`;
        if (!prepared.existing.includes(image.id)) {
          const response = await api(`/v1/image?job=${encodeURIComponent(job.id)}&image=${encodeURIComponent(image.id)}&receiver=${encodeURIComponent(receiver)}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          await rpc('import', { job, imageID: image.id, bytes });
        }
        await api('/v1/ack', { jobID: job.id, imageID: image.id, receiver });
      }
      status.textContent = `Added ${job.images.length} images to ${job.destination.name}.`;
      registered = true;
    } catch (error) {
      status.textContent = error.message.includes('fetch') || error.name === 'TimeoutError'
        ? 'Waiting for the macOS app. Choose Send to Figma in Finder, or open the app.' : error.message;
      if (job) await api('/v1/error', { jobID: job.id, message: status.textContent, receiver }).catch(() => {});
    } finally { busy = false; }
  }

  window.onmessage = event => {
    // Figma relays replies through its sandbox; event.source is not always parent.
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'reply') {
      const request = pending.get(message.requestID);
      if (!request) return;
      clearTimeout(request.timeout);
      pending.delete(message.requestID);
      if (message.error) request.reject(new Error(message.error)); else request.resolve(message.result);
    }
  };

  document.getElementById('connection').ontoggle = () => {
    rpc('resize', { height: document.getElementById('connection').open ? 460 : 350 }).catch(() => {});
  };
  rpc('bootstrap').then(configuration => {
    token = configuration.token;
    fileKey = configuration.fileKey;
    document.getElementById('key').value = token;
    document.getElementById('name').value = configuration.name;
    document.getElementById('connection').open = !token;
    if (!fileKey) status.textContent = 'Run this development plugin in a saved Design file with file identity access.';
    else if (!token) status.textContent = 'Copy the connection key from the macOS app.';
    else poll();
  }).catch(error => { status.textContent = error.message; });

  document.getElementById('connect').onclick = async () => {
    try {
      const result = await rpc('configure', { token: document.getElementById('key').value.trim() });
      token = result.token;
      registered = false;
      await poll();
    } catch (error) { status.textContent = error.message; }
  };
  save.onclick = async () => {
    if (busy) return;
    busy = true;
    save.disabled = true;
    try {
      const destination = await rpc('registration', { name: document.getElementById('name').value });
      await api('/v1/destinations', destination);
      registered = true;
      status.textContent = `Saved ${destination.name}. Ready for images from Finder.`;
      document.getElementById('connection').open = false;
    } catch (error) { status.textContent = error.message; }
    finally { busy = false; save.disabled = false; }
  };
  setInterval(poll, 2000);
</script>
</html>
