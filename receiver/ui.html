<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 16px; font: 12px/1.5 Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  .surface { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--figma-color-border, #eee); border-radius: 14px; background: var(--figma-color-bg-secondary, #f5f5f5); }
  input, button { width: 100%; padding: 8px 12px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; text-align: left; background: var(--figma-color-bg, #fff); }
  input { color: inherit; }
  button { color: var(--figma-color-text-brand, #009fff); cursor: pointer; }
  button:hover { background: var(--figma-color-bg-hover, #f0f8ff); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid #009fff; outline-offset: 3px; }
  #destination { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 999px; box-shadow: 0 2px 8px #0000000a; }
  #name { flex: 1; min-width: 0; line-height: 20px; border-radius: 999px; background: transparent; }
  #save { display: grid; place-items: center; flex: 0 0 36px; width: 36px; height: 36px; padding: 8px; border-radius: 50%; color: #fff; background: #aaa; box-shadow: 0 0 0 3px #00000008; }
  #save:hover, #save[data-phase="saved"], #save[data-phase="busy"] { background: #008cff; }
  #save svg { width: 20px; height: 20px; }
  #save svg > * { display: none; }
  #save[data-phase="ready"] .arrow, #save[data-phase="saved"] .check, #save[data-phase="busy"] .activity,
  #save[data-phase="warning"] .issue, #save[data-phase="error"] .issue { display: block; }
  #save[data-phase="busy"] svg { animation: spin 1s linear infinite; }
  #save[data-phase="warning"] { background: #c48200; opacity: 1; }
  #save[data-phase="error"] { background: #e5484d; opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #save[data-phase="busy"] svg { animation: none; } }
  #pairing-code { text-align: center; font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: 6px; }
  p { margin: 0; color: var(--figma-color-text-secondary, #666); }
  #status { margin-top: 12px; overflow-wrap: anywhere; }
  #status:empty { display: none; }
  #destination:not([hidden]) + #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  [data-warning="true"] { display: flex; gap: 8px; padding: 10px; border: 1px solid var(--figma-color-border-warning, #eacb7a); border-radius: 10px; color: var(--figma-color-text-warning, #8a5700); background: var(--figma-color-bg-warning-tertiary, #fff5d6); }
  [data-warning="true"]::before { content: "⚠"; font-size: 16px; line-height: 18px; }
</style>
<main id="content">
<section id="connection" class="surface">
  <button id="connect"><span id="connect-label">Connect to Mac</span></button>
  <div id="pairing-code" hidden></div>
  <p id="pairing-help" data-warning="true">Open Figma x Finder on your Mac.</p>
</section>
<section id="destination" hidden>
  <input id="name" maxlength="120" placeholder="Destination name" aria-label="Destination name" autocomplete="off" spellcheck="false">
  <button id="save" data-phase="ready" aria-label="Save destination" title="Save destination" disabled>
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="arrow" d="M4 10h12m-5-5 5 5-5 5"/>
      <path class="check" d="m5 10 3 3 7-7"/>
      <circle class="activity" cx="10" cy="10" r="7" stroke-dasharray="30 14"/>
      <path class="issue" d="M10 5v6m0 4h.01"/>
    </svg>
  </button>
</section>
<p id="status" role="status" aria-live="polite">Connecting…</p>
</main>
<script>
  const endpoint = 'http://localhost:17847';
  const receiver = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const pending = new Map();
  let sequence = 0, token = '', fileKey = null, busy = false, connected = false, pairing = false;
  let idleMessage = '';
  let savedChange = null;
  let activeJob = null;
  const openApp = 'Open Figma x Finder on your Mac.';
  const $ = id => document.getElementById(id);
  const status = $('status'), save = $('save'), connect = $('connect');

  if (typeof ResizeObserver !== 'undefined') {
    let previousHeight = 0;
    new ResizeObserver(() => {
      const height = Math.ceil($('content').getBoundingClientRect().height) + 32;
      if (height === previousHeight) return;
      previousHeight = height;
      rpc('resize', { height }).catch(() => {});
    }).observe($('content'));
  }

  function rpc(type, payload = {}) {
    const requestID = ++sequence;
    return new Promise((resolve, reject) => {
      const request = { resolve, reject };
      request.timeout = setTimeout(() => {
        // This is a warning, not cancellation: keep the operation and its
        // promise alive so a late reply continues the original batch directly.
        setStatus('Figma is taking longer than expected. Waiting for the current operation; close and rerun the receiver if it stays stuck.', 'warning');
      }, 30000);
      pending.set(requestID, request);
      try { parent.postMessage({ pluginMessage: { type, requestID, ...payload } }, '*'); }
      catch (error) { clearTimeout(request.timeout); pending.delete(requestID); reject(error); }
    });
  }

  function showConnection(isConnected) {
    connected = isConnected;
    $('connection').hidden = isConnected;
    $('destination').hidden = !isConnected;
    save.disabled = !isConnected || !fileKey || busy;
  }

  function feedback(message = '') {
    idleMessage = message;
    setStatus(message);
  }

  function setStatus(message, phase = message ? (message === openApp ? 'warning' : 'error') : 'ready') {
    status.textContent = message;
    status.dataset.warning = String(message === openApp);
    $('pairing-help').hidden = message === openApp;
    save.dataset.phase = phase === 'ready' && savedChange ? 'saved' : phase;
    save.ariaLabel = savedChange ? 'Undo save' : 'Save destination';
    save.title = message || save.ariaLabel;
    connect.title = message;
  }

  function setSaved(change) {
    savedChange = change;
    feedback();
  }

  function errorMessage(error) { return error instanceof TypeError || error.name === 'TimeoutError' ? openApp : error.message; }

  async function pairingAPI(path, body = {}) { return (await api(path, body)).json(); }

  async function api(path, body) {
    const isPairing = path.startsWith('/v1/pairing/');
    const response = await fetch(endpoint + path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { ...(!isPairing ? { Authorization: `Bearer ${token}` } : {}), ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: AbortSignal.timeout(10000)
    });
    if (!response.ok) {
      if (response.status === 401) {
        showConnection(false);
        throw new Error('Please connect to your Mac again.');
      }
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || (isPairing ? 'Connection request ended. Click Connect to try again.' : 'The local connection interrupted delivery. Retrying…'));
    }
    return response;
  }

  async function poll() {
    if (!connected || !token || !fileKey || busy || pairing) return;
    busy = true;
    let job;
    try {
      const response = await api(`/v1/jobs?fileKey=${encodeURIComponent(fileKey)}&receiver=${encodeURIComponent(receiver)}`);
      if (response.status === 204) {
        save.disabled = false;
        setStatus(idleMessage);
        return;
      }
      job = await response.json();
      activeJob = job.id;
      save.disabled = true;
      setStatus('Receiving images…', 'busy');
      const prepared = await rpc('prepare', { job });
      const completed = new Set(job.completed);
      const existing = new Set(prepared.existing);
      for (const image of job.images) {
        if (completed.has(image.id)) continue;
        setStatus(`Adding ${image.name}…`, 'busy');
        if (!existing.has(image.id)) {
          const response = await api(`/v1/image?job=${encodeURIComponent(job.id)}&image=${encodeURIComponent(image.id)}&receiver=${encodeURIComponent(receiver)}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          await rpc('import', { job, imageID: image.id, bytes });
        }
        await api('/v1/ack', { jobID: job.id, imageID: image.id, receiver });
      }
      feedback();
      save.disabled = false;
    } catch (error) {
      save.disabled = true;
      setStatus(errorMessage(error));
      if (job) await api('/v1/error', { jobID: job.id, message: status.textContent, receiver }).catch(() => {});
    } finally { busy = false; activeJob = null; }
  }

  window.onmessage = event => {
    // Figma relays replies through its sandbox; event.source is not always parent.
    const message = event.data?.pluginMessage;
    if (!message) return;
    if (message.type === 'reply') {
      const request = pending.get(message.requestID);
      if (!request) return;
      clearTimeout(request.timeout);
      pending.delete(message.requestID);
      if (message.error) request.reject(new Error(message.error)); else request.resolve(message.result);
    }
  };

  rpc('bootstrap').then(configuration => {
    token = configuration.token;
    fileKey = configuration.fileKey;
    $('name').value = configuration.name;
    showConnection(Boolean(token));
    if (!fileKey) setStatus('Save this file and rerun the plugin.');
    else if (!token) setStatus('');
    else poll();
  }).catch(error => { setStatus(error.message); });

  connect.onclick = async () => {
    if (pairing || busy) return;
    pairing = true;
    connect.disabled = true;
    $('connect-label').textContent = 'Waiting for approval…';
    try {
      const request = await pairingAPI('/v1/pairing/start');
      $('pairing-code').textContent = request.code;
      $('pairing-code').hidden = false;
      $('pairing-help').textContent = 'Approve this code on your Mac.';
      $('pairing-help').dataset.warning = 'false';
      setStatus('');
      const deadline = Date.now() + 120000;
      let result;
      while (Date.now() < deadline) {
        result = await pairingAPI('/v1/pairing/status', { id: request.id });
        if (result.state === 'connected') break;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      if (result?.state !== 'connected') throw new Error('Connection request expired. Click Connect to try again.');
      const configuration = await rpc('configure', { token: result.token });
      token = configuration.token;
      showConnection(true);
      feedback(fileKey ? '' : 'Save this file and rerun the plugin.');
    } catch (error) {
      setStatus(errorMessage(error));
    } finally {
      pairing = false;
      connect.disabled = false;
      $('connect-label').textContent = 'Connect to Mac';
      $('pairing-code').hidden = true;
      $('pairing-help').textContent = openApp;
      $('pairing-help').dataset.warning = 'true';
    }
    if (connected) await poll();
  };
  save.onclick = async () => {
    if (busy || pairing || !connected || !fileKey) return;
    busy = true;
    save.disabled = true;
    $('name').disabled = true;
    setStatus(savedChange ? 'Undoing save…' : 'Saving destination…', 'busy');
    try {
      if (savedChange) {
        await api('/v1/destinations/undo', savedChange);
        if (savedChange.previousName !== undefined && savedChange.previousName !== null) $('name').value = savedChange.previousName;
        setSaved(null);
      } else {
        const destination = await rpc('registration', { name: $('name').value });
        setSaved(await (await api('/v1/destinations', destination)).json());
      }
    } catch (error) { feedback(errorMessage(error)); }
    finally { busy = false; $('name').disabled = false; save.disabled = !connected || !fileKey; }
  };
  $('name').oninput = () => { setSaved(null); };
  $('name').onkeydown = event => {
    if (event.key === 'Enter' && !event.isComposing && !save.disabled) {
      event.preventDefault();
      save.onclick();
    }
  };
  setInterval(poll, 2000);
  // Keep ownership during slow decoding or page loading, including after a
  // UI timeout. Another receiver must not take over an in-flight import.
  setInterval(() => {
    if (activeJob) api('/v1/lease', { jobID: activeJob, receiver }).catch(() => {});
  }, 20000);
</script>
</html>
